name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install & test backend
        working-directory: backend
        run: |
          npm ci || npm install
          npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check web assets
        run: |
          for f in web/js/*.js; do node --check "$f"; done

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync web assets into WebView shell
        run: ./scripts/sync_web_assets.sh
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

  license-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required license files
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f third_party/pienoon/LICENSE
          test -f third_party/pienoon/LICENSE.txt
          grep -q "Google Inc" NOTICE
          grep -q "Apache License" LICENSE
          echo "License files OK"
